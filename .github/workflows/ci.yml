name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: [self-hosted, studio]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/provably
      - name: Test
        # Start coverage before pytest loads the installed provably plugin;
        # pytest-cov otherwise imports the package before measurement and
        # emits a module-not-measured warning.
        #
        # Gate raised 90 -> 95 (2026-10-01): test_coverage_95.py's name claims
        # ">=95%" but no assertion measured it — the only enforced number was
        # 90 (bec2d54, measured baseline 93 then). This gate is now the
        # measured assertion of that claim. Measured baseline after the
        # engine.py fast_key/orjson/rlimit gap tests landed: 98.19% exact
        # (98 displayed; 97.93% immediately before them), py3.13 branch
        # coverage. 95 keeps ~3pt headroom, the margin the old gate had.
        run: |
          coverage erase
          coverage run --source=provably -m pytest tests/
          coverage report --fail-under=95
